name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          "$HOME/gradle/gradle-8.7/bin/gradle" assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk IsraelTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IsraelTV-apk
          path: IsraelTV.apk
