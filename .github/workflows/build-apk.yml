name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          "$HOME/gradle/gradle-8.7/bin/gradle" assembleRelease --no-daemon --stacktrace
          VERSION=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "IsraelTV-v$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: IsraelTV-v${{ env.VERSION }}
          path: IsraelTV-v${{ env.VERSION }}.apk
