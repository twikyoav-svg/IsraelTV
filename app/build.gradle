plugins {
    id 'com.android.application'
}

android {
    namespace 'il.tv.israeltv'
    compileSdk 34

    defaultConfig {
        applicationId 'il.tv.israeltv'
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName '2.3'
    }

    signingConfigs {
        // Fixed key kept in the project, so every new build installs over the previous one.
        fixed {
            storeFile file('israeltv.keystore')
            storePassword 'israeltv'
            keyAlias 'israeltv'
            keyPassword 'israeltv'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Native player for direct live streams (TV + radio).
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
